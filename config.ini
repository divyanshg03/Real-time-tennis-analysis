# Real-time Tennis Analysis Configuration
# This file contains configurable parameters for the analysis system

[Video]
# Default FPS for analysis (will be overridden by actual video FPS)
default_fps = 30.0

[Tracking]
# Ball tracking parameters
ball_min_radius = 5
ball_max_radius = 50

# Player tracking parameters
player_min_contour_area = 1000
max_players = 4

# History length (number of frames to keep in memory)
trajectory_history_length = 30

[Speed Calculation]
# Default scale: pixels per meter
# This should be calibrated based on your video
default_pixels_per_meter = 100.0

# Time window for speed calculation (in frames)
speed_calculation_window = 5

[Court]
# Standard tennis court dimensions (in feet)
court_length_ft = 78
court_width_ft = 36

[Visualization]
# Colors (BGR format)
ball_color = 0,255,255
player_color = 255,0,0
trajectory_color = 0,255,0
text_color = 255,255,255

# Font settings
font_scale = 0.6
thickness = 2

# Display options
show_trajectory = true
show_statistics = true
show_frame_number = true
